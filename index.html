<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examen de Inglés A2</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h1 { text-align: center; color: #333; font-size: 24px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #004494; }
    #error-msg { color: red; text-align: center; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Registro al Examen</h1>
    <form id="registro-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" required>
      </div>
      <div class="form-group">
        <label for="matricula">Matrícula</label>
        <input type="text" id="matricula" required>
      </div>
      <div class="form-group">
        <label for="carrera">Carrera</label>
        <select id="carrera" required>
          <option value="">Selecciona una opción</option>
          <option value="Derecho">Derecho</option>
          <option value="Administracion">Administración</option>
          <option value="Ingenieria">Ingeniería</option>
          <!-- Agrega más carreras según necesites -->
        </select>
      </div>
      <div class="form-group">
        <label for="grado">Grado (Semestre)</label>
        <input type="number" id="grado" min="1" max="10" required>
      </div>
      <div class="form-group">
        <label for="grupo">Grupo</label>
        <input type="text" id="grupo" required>
      </div>
      <button type="submit">Comenzar Examen</button>
      <p id="error-msg"></p>
    </form>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
