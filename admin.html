<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración - Resultados</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
    .admin-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 1000px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background-color: #0056b3; color: white; }
    .filtros { display: flex; gap: 15px; margin-bottom: 20px; }
    select, input { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <div class="admin-container">
    <h2>Resultados de Evaluación</h2>
    
    <div class="filtros">
      <select id="filtro-carrera">
        <option value="">Todas las carreras</option>
        <option value="Derecho">Derecho</option>
        <option value="Administracion">Administración</option>
        <option value="Ingenieria">Ingeniería</option>
      </select>
      <input type="text" id="filtro-grupo" placeholder="Filtrar por grupo (ej. B)">
      <button onclick="cargarResultados()">Actualizar Datos</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Matrícula</th>
          <th>Nombre</th>
          <th>Carrera</th>
          <th>Grado/Grupo</th>
          <th>Puntaje</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="tabla-resultados">
        <!-- Los datos se inyectarán aquí -->
      </tbody>
    </table>
  </div>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
