<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración - Resultados</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
    .admin-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 1000px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background-color: #0056b3; color: white; }
    .filtros { display: flex; gap: 15px; margin-bottom: 20px; }
    select, input { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <div class="admin-container">
    <h2>Resultados de Evaluación</h2>
    
    <div class="filtros">
     <select id="filtro-carrera">
  <option value="">Todos los programas</option>
  <option value="Acondicionamiento Físico">Acondicionamiento Físico</option>
  <option value="Administración de Empresas">Administración de Empresas</option>
  <option value="Arquitectura">Arquitectura</option>
  <option value="Contabilidad y Finanzas">Contabilidad y Finanzas</option>
  <option value="Contaduría Pública">Contaduría Pública</option>
  <option value="Criminología y Criminalística">Criminología y Criminalística</option>
  <option value="Derecho">Derecho</option>
  <option value="Diseño de Imagen Personal">Diseño de Imagen Personal (Estilismo)</option>
  <option value="Enfermería">Enfermería</option>
  <option value="Fisioterapia">Fisioterapia</option>
  <option value="Gastronomía">Gastronomía</option>
  <option value="Idiomas">Idiomas</option>
  <option value="Ingeniería Civil">Ingeniería Civil</option>
  <option value="Ingeniería en Software y Redes">Ingeniería en Software y Redes</option>
  <option value="Ingeniería Industrial">Ingeniería Industrial</option>
  <option value="Inteligencia Artificial">Inteligencia Artificial</option>
  <option value="Lengua Inglesa">Lengua Inglesa</option>
  <option value="Marketing Digital">Marketing Digital</option>
  <option value="Negocios Internacionales">Negocios Internacionales</option>
  <option value="Pedagogía">Pedagogía</option>
  <option value="Preparatoria UAMP">Preparatoria UAMP</option>
  <option value="Psicología">Psicología</option>
  <option value="Psicopedagogía">Psicopedagogía</option>
</select>
      <input type="text" id="filtro-grupo" placeholder="Filtrar por grupo (ej. B)">
      <button onclick="cargarResultados()">Actualizar Datos</button>
    </div>

    <table>
<thead>
  <tr>
    <th>Matrícula</th>
    <th>Nombre</th>
    <th>Carrera</th>
    <th>Grado y Grupo</th>
    <th>Puntaje</th>
    <th>Progreso</th>
    <th>Estatus</th>
  </tr>
</thead>
  <tbody id="tabla-body">
    <!-- Los resultados se inyectan aquí -->
  </tbody>
</table>
    <!-- CONTROLES DE PAGINACIÓN -->
      <div style="text-align: center; margin-top: 20px; margin-bottom: 40px;">
        <button id="btn-anterior" onclick="cambiarPagina(-1)" disabled style="padding: 8px 16px; margin-right: 10px; cursor: pointer;">⬅️ Anterior</button>
        <span id="indicador-pagina" style="font-weight: bold; font-size: 16px;">Página 1</span>
        <button id="btn-siguiente" onclick="cambiarPagina(1)" style="padding: 8px 16px; margin-left: 10px; cursor: pointer;">Siguiente ➡️</button>
  </div>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
